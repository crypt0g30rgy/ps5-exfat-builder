name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow tkinterdnd2 psutil "mkpfs==0.0.8" cryptography

      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $match = Select-String -Path exfat_builder.py -Pattern "^APP_VERSION = '([^']+)'" | Select-Object -First 1
          if (-not $match) {
            throw "Could not find APP_VERSION in exfat_builder.py"
          }
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG_NAME) {
            throw "Tag $env:TAG_NAME does not match APP_VERSION v$version. Bump APP_VERSION before tagging."
          }
          Write-Host "Tag $env:TAG_NAME matches APP_VERSION v$version"

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $pyiArgs = @(
            '--onefile',
            '--windowed',
            '--clean',
            '--noconfirm',
            '--name', 'exFAT Image Builder',
            '--icon', 'controller.ico',
            '--hidden-import', 'PIL._tkinter_finder',
            '--hidden-import', 'psutil',
            '--hidden-import', 'mkpfs',
            '--hidden-import', 'mkpfs.__main__',
            '--hidden-import', 'mkpfs.cli',
            '--hidden-import', 'mkpfs.pfs',
            '--hidden-import', 'mkpfs.utils',
            '--hidden-import', 'mkpfs.consts',
            '--hidden-import', 'mkpfs.logging',
            '--hidden-import', 'mkpfs.pbar',
            '--hidden-import', 'cryptography',
            '--hidden-import', 'cryptography.hazmat.primitives.ciphers',
            '--hidden-import', 'cryptography.hazmat.primitives.ciphers.algorithms',
            '--hidden-import', 'cryptography.hazmat.primitives.ciphers.modes',
            '--hidden-import', 'cryptography.hazmat.backends',
            '--hidden-import', 'cryptography.hazmat.backends.openssl',
            '--hidden-import', 'cryptography.hazmat.backends.openssl.backend',
            '--collect-all', 'mkpfs',
            '--collect-all', 'cryptography',
            '--collect-all', 'tkinterdnd2',
            '--collect-submodules', 'ui',
            '--collect-submodules', 'ui.shared',
            '--paths', '.',
            'exfat_builder.py'
          )
          python -m PyInstaller @pyiArgs

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/exFAT Image Builder.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected build output was not created: $exe"
          }
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -lt 5MB) {
            throw "Built exe is only $size bytes; expected a onefile PyInstaller build of at least 5 MB."
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  exFAT Image Builder.exe" |
            Out-File -Encoding ASCII 'dist/exFAT Image Builder.exe.sha256'
          Write-Host ("Built {0:N0} bytes, SHA256 {1}" -f $size, $hash)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfat-image-builder-windows-x64
          path: |
            dist/exFAT Image Builder.exe
            dist/exFAT Image Builder.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: exfat-image-builder-windows-x64
          path: dist

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          EXE="dist/exFAT Image Builder.exe"
          SHA="dist/exFAT Image Builder.exe.sha256"
          ls -l "$EXE" "$SHA"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; updating assets."
            gh release upload "$TAG_NAME" "$EXE" "$SHA" --clobber
          else
            echo "Creating release $TAG_NAME."
            gh release create "$TAG_NAME" "$EXE" "$SHA" \
              --title "exFAT Image Builder $TAG_NAME" \
              --generate-notes
          fi
