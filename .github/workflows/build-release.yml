name: Build and Release

on:
  # Build on main and release tags only. Pull requests are validated
  # locally; they must not consume a Windows build runner.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow tkinterdnd2 psutil "mkpfs==0.0.8" cryptography

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            throw "Tag $env:TAG_NAME is not a valid release tag. Use vMAJOR.MINOR.PATCH."
          }
          Write-Host "Release version $($env:TAG_NAME.Substring(1)) comes from tag $env:TAG_NAME"

      - name: Refuse to overwrite an existing release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # A missing release is the expected case, so clear the native
          # command's nonzero exit code before the step finishes.
          $releaseExists = $false
          gh release view $env:TAG_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          $LASTEXITCODE = 0
          if ($releaseExists) {
            throw "Release $env:TAG_NAME already exists. Versions are immutable; create a new tag instead."
          }
          Write-Host "No existing release for $env:TAG_NAME"

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Embed version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.Substring(1)
          "BUILD_VERSION = '$version'" |
            Set-Content -LiteralPath '_build_version.py' -Encoding ASCII
          python -c "import _build_version; from app_version import resolve_version; assert _build_version.BUILD_VERSION == '$version'; assert resolve_version('0', _build_version.BUILD_VERSION) == '$version'"
          if ($LASTEXITCODE -ne 0) {
            throw "The tag-derived version did not validate."
          }
          Get-Content -LiteralPath '_build_version.py'

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $pyiArgs = @(
            '--onefile',
            '--windowed',
            '--clean',
            '--noconfirm',
            '--name', 'exFAT_Image_Builder',
            '--icon', 'controller.ico',
            '--hidden-import', 'PIL._tkinter_finder',
            '--hidden-import', 'psutil',
            '--hidden-import', 'mkpfs',
            '--hidden-import', 'mkpfs.__main__',
            '--hidden-import', 'mkpfs.cli',
            '--hidden-import', 'mkpfs.pfs',
            '--hidden-import', 'mkpfs.utils',
            '--hidden-import', 'mkpfs.consts',
            '--hidden-import', 'mkpfs.logging',
            '--hidden-import', 'mkpfs.pbar',
            '--hidden-import', 'cryptography',
            '--hidden-import', 'cryptography.hazmat.primitives.ciphers',
            '--hidden-import', 'cryptography.hazmat.primitives.ciphers.algorithms',
            '--hidden-import', 'cryptography.hazmat.primitives.ciphers.modes',
            '--hidden-import', 'cryptography.hazmat.backends',
            '--hidden-import', 'cryptography.hazmat.backends.openssl',
            '--hidden-import', 'cryptography.hazmat.backends.openssl.backend',
            '--collect-all', 'mkpfs',
            '--collect-all', 'cryptography',
            '--collect-all', 'tkinterdnd2',
            '--collect-submodules', 'ui',
            '--collect-submodules', 'ui.shared',
            '--paths', '.',
            'exfat_builder.py'
          )
          python -m PyInstaller @pyiArgs

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/exFAT_Image_Builder.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected build output was not created: $exe"
          }
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -lt 5MB) {
            throw "Built exe is only $size bytes; expected a onefile PyInstaller build of at least 5 MB."
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  exFAT_Image_Builder.exe" |
            Out-File -Encoding ASCII 'dist/exFAT_Image_Builder.exe.sha256'
          Write-Host ("Built {0:N0} bytes, SHA256 {1}" -f $size, $hash)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: exfat-image-builder-windows-x64
          path: |
            dist/exFAT_Image_Builder.exe
            dist/exFAT_Image_Builder.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: exfat-image-builder-windows-x64
          path: dist

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          EXE="dist/exFAT_Image_Builder.exe"
          SHA="dist/exFAT_Image_Builder.exe.sha256"
          ls -l "$EXE" "$SHA"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists. Versions are immutable; create a new tag instead."
            exit 1
          fi
          echo "Creating release $TAG_NAME."
          gh release create "$TAG_NAME" "$EXE" "$SHA" \
            --title "exFAT Image Builder $TAG_NAME" \
            --generate-notes
